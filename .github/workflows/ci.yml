name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-25.11
      - name: build the flake (also runs the tests)
        run: nix build -L
      - run: nix flake check
      - run: ./result/bin/lazyflakes --version
      # The end-to-end and VM tests need a NixOS host; run them locally
      # (see README, Development).
      - name: evaluate generated modules in real NixOS configurations
        run: go test -count=1 -timeout 30m ./internal/config ./internal/managed ./internal/options ./internal/ui
        env:
          LAZYFLAKES_NIX_EVAL: "1"
        shell: nix develop --command bash -e {0}
