name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
      - name: build the flake (also runs the tests)
        run: nix build -L
      - run: nix flake check
      - run: ./result/bin/lazyflakes --version
      # The end-to-end and VM tests need a NixOS host; run them locally
      # (see README, Development).
      - name: evaluate generated modules in real NixOS configurations
        run: go test -count=1 -timeout 30m ./internal/managed
        env:
          LAZYFLAKES_NIX_EVAL: "1"
        shell: nix develop --command bash -e {0}
